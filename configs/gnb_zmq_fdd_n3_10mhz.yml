# Minimal control-plane test configuration for macOS: a single FDD cell in band 3 with 10 MHz bandwidth,
# driven by the ZMQ radio backend (no RF hardware, no OFH/NIC dependency). The purpose of this configuration
# is to validate, layer by layer:
#   1. the kqueue io_broker event loop and the Mach-time 1 ms DU clock (slot scheduler ticking),
#   2. the usrsctp SCTP bridge (socketpair + upcall wake-ups through kqueue),
#   3. the NGAP association handshake towards the AMF.
#
# Prerequisites:
#   - An AMF reachable from this host (e.g., Open5GS or free5GC). Point cu_cp.amf.addrs at it and make sure
#     the AMF is configured with PLMN 00101 and TAC 7 (see supported_tracking_areas below).
#   - libzmq installed (Homebrew: brew install zeromq).
#
# Run with: ./build/apps/gnb/gnb -c configs/gnb_zmq_fdd_n3_10mhz.yml

cu_cp:
  amf:
    # Address of the AMF (NGAP/SCTP). The srsRAN test-setup convention is 127.0.1.100; change it to the address
    # of your AMF if it runs on another host.
    addrs: 192.168.100.153
    port: 38412
    # Local address the NGAP SCTP client binds to. Must be an address of this host that is routable
    # towards the AMF (127.0.0.1 only works when the AMF runs on the same machine).
    bind_addrs: 192.168.100.125
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1

ru_sdr:
  # ZMQ radio: samples are exchanged over TCP sockets, no radio frontend or raw ethernet (OFH) is involved.
  device_driver: zmq
  # tx_port: gNB transmits baseband samples from this socket (a UE/simulator may connect to it).
  # rx_port: gNB receives baseband samples from this socket. For control-plane-only tests nothing needs to
  #          connect to these ports; the gNB will simply idle in its slot loop.
  device_args: tx_port=tcp://*:2000,rx_port=tcp://192.168.100.153:2001,base_srate=11.52e6
  srate: 11.52
  # The ZMQ backend only accepts gains <= 0.0 dB (see the ZMQ radio config validator).
  tx_gain: 0
  rx_gain: 0

cell_cfg:
  dl_arfcn: 368640
  band: 3
  channel_bandwidth_MHz: 10
  common_scs: 15
  plmn: "00101"
  tac: 7
  pci: 1

log:
  filename: /tmp/gnb.log
  # Debug level for control-plane bring-up diagnosis (SCTP-GW / NGAP). Switch back to info once stable.
  all_level: debug
  lib_level: debug

pcap:
  mac_enable: false
  mac_filename: /tmp/gnb_mac.pcap
  # Capture NGAP PDUs at the gateway boundary to verify Tx/Rx in both directions.
  ngap_enable: true
  ngap_filename: /tmp/gnb_ngap.pcap
