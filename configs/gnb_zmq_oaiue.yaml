# OCUDU gNB config for the OAI UE - based on the official tutorial config
# (https://docs.ocudu.org/tutorials/oaiue/, assets/gnb_zmq.yaml), modified for the
# cross-host ZMQ setup: gNB on macOS (192.168.100.125 / 192.168.64.1), OAI UE on
# Ubuntu VM (192.168.64.2), Open5GS core on 192.168.100.127.
#
# ZMQ pairing (REP binds, REQ connects):
#   gNB TX (REP) bind  tcp://0.0.0.0:4556   <->  UE RX (REQ) connect tcp://192.168.64.1:4556
#   gNB RX (REQ) connect tcp://192.168.64.2:4557  <->  UE TX (REP) bind  tcp://0.0.0.0:4557
#
# To run:
#   sudo ./gnb -c gnb_zmq_oaiue.yaml

cu_cp:
  amf:
    no_core: false
    addr: 192.168.100.127            # The address or hostname of the AMF (Open5GS core, separate VM).
    port: 38412
    bind_addr: 192.168.100.125       # A local IP that the gNB binds to for traffic from the AMF.
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1
  inactivity_timer: 7200            # Sets the UE/PDU Session/DRB inactivity timer to 7200 seconds. Supported: [1 - 7200].

ru_sdr:
  device_driver: zmq
  device_args: tx_port=tcp://0.0.0.0:4556,rx_port=tcp://192.168.64.2:4557
  srate: 23.04
  tx_gain: -12                      # Back off from full scale, required by OAI fixed point FFT
                                    # (also macOS ZMQ requires gain <= 0 dB)
  rx_gain: 0

cell_cfg:
  dl_arfcn: 632628
  band: 78
  channel_bandwidth_MHz: 20
  common_scs: 30
  plmn: "00101"
  tac: 7
  pci: 1
  tdd_ul_dl_cfg:
    dl_ul_tx_period: 5
    nof_dl_slots: 3
    nof_dl_symbols: 10
    nof_ul_slots: 1
    nof_ul_symbols: 2
  csi:
    csi_rs_enabled: true
  pucch:
    nof_cell_csi_res: 1

log:
  filename: /tmp/gnb.log            # Path of the log file.
  all_level: info                   # Logging level applied to all layers.
  hex_max_size: 0

pcap:
  mac_enable: false                 # Set to true to enable MAC-layer PCAPs.
  mac_filename: /tmp/gnb_mac.pcap   # Path where the MAC PCAP is stored.
  ngap_enable: false                # Set to true to enable NGAP PCAPs.
  ngap_filename: /tmp/gnb_ngap.pcap # Path where the NGAP PCAP is stored.

expert_phy:
  pusch_ldpc_decoder_type: auto
  pusch_dec_max_iterations: 6
  # G-3 (20 MHz ZMQ E2E): helena (bucket dispatch <=52 PRB -> 52-model,
  # 53..106 PRB -> 106-model, <6 PRB -> classical). A/B: cpu / metal_mmse.
  pusch_channel_estimator_algo: helena
