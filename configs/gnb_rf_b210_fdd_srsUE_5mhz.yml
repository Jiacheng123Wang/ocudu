# 5 MHz n3 FDD cell in the verified-clean window (1805-1810.5 MHz).
# Everything else mirrors the ZMQ srsUE config (gnb_zmq.yaml), transport swapped to UHD B210.
cu_cp:
  amf:
    addrs: 192.168.100.127
    port: 38412
    bind_addrs: 192.168.100.125
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1

ru_sdr:
  device_driver: uhd
  device_args: type=b200
  clock: external
  # 2x oversampling of the 5 MHz cell: a B210 cannot hold the natural 7.68 MHz master clock rate (UHD 4.6
  # stops clocking the FPGA below ~9.6 MHz, see gnb_rf_b200_fdd_n1_5mhz_bridge.yml).
  srate: 15.36
  tx_gain: 80
  rx_gain: 70

cell_cfg:
  dl_arfcn: 361500
  band: 3
  channel_bandwidth_MHz: 5
  common_scs: 15
  plmn: "00101"
  tac: 7
  pdcch:
    dedicated:
      ss2_type: common
      dci_format_0_1_and_1_1: false
    common:
      ss0_index: 0
      coreset0_index: 0
  prach:
    prach_config_index: 1
    total_nof_ra_preambles: 64
    nof_ssb_per_ro: 1
    nof_cb_preambles_per_ssb: 64
  pdsch:
    mcs_table: qam64
  pusch:
    mcs_table: qam64

log:
  filename: /tmp/gnb.log
  all_level: debug

pcap:
  mac_enable: false
  mac_filename: /tmp/gnb_mac.pcap
  ngap_enable: false
  ngap_filename: /tmp/gnb_ngap.pcap

