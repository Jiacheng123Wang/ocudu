# OCUDU gNB config for the OAI UE at 40 MHz / 106 PRB (ZMQ harness).
# 20 MHz @ 30 kHz is only 51 PRB (3GPP bandwidth table), so the HELENA 106-PRB
# bucket can never fire on the RF rig (B200 can't do 40 MHz). In the ZMQ
# harness the sample rate is virtual: a 40 MHz cell (106 PRB @ 30 kHz) runs at
# 46.08 Msps on both ends - this is the ONLY way to collect real 106-PRB PUSCH
# grants for the 106-model fine-tune.
#
# ZMQ pairing (REP binds, REQ connects):
#   gNB TX (REP) bind  tcp://0.0.0.0:4556   <->  UE RX (REQ) connect tcp://198.19.0.1:4556
#   gNB RX (REQ) connect tcp://198.19.0.2:4557  <->  UE TX (REP) bind  tcp://0.0.0.0:4557
#
# Run (on this Mac; capture env after sudo):
#   sudo OCUDU_HELENA_DUMP_DIR=<abs dir> OCUDU_CE_TIME=1 ./gnb -c gnb_zmq_oaiue_40mhz.yaml

cu_cp:
  amf:
    no_core: false
    addr: 192.168.100.127            # Open5GS core (separate host - must be running).
    port: 38412
    bind_addr: 192.168.100.125       # Local IP the gNB binds to for the AMF.
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1
  inactivity_timer: 7200

ru_sdr:
  device_driver: zmq
  device_args: tx_port=tcp://0.0.0.0:4556,rx_port=tcp://192.168.100.153:4557
  srate: 46.08                      # 40 MHz @ 30 kHz: 106 PRB occupied, 46.08 Msps
  tx_gain: -12                      # Back off from full scale (OAI fixed point FFT)
  rx_gain: 0

cell_cfg:
  dl_arfcn: 632640                   # 3489.6 MHz (on the 300 kHz + 7.2n grids)
  band: 78
  channel_bandwidth_MHz: 40          # -> 106 PRB @ 30 kHz SCS
  common_scs: 30
  plmn: "00101"
  tac: 7
  pci: 1
  tdd_ul_dl_cfg:
    dl_ul_tx_period: 5
    nof_dl_slots: 3
    nof_dl_symbols: 10
    nof_ul_slots: 1
    nof_ul_symbols: 2
  csi:
    csi_rs_enabled: true
  pucch:
    nof_cell_csi_res: 1

log:
  filename: /tmp/gnb.log
  all_level: debug
  hex_max_size: 0

pcap:
  mac_enable: false
  mac_filename: /tmp/gnb_mac.pcap
  ngap_enable: false
  ngap_filename: /tmp/gnb_ngap.pcap

expert_phy:
  pusch_ldpc_decoder_type: auto
  pusch_dec_max_iterations: 6
  pusch_channel_estimator_algo: helena
