# OAI UE configuration for over-the-air operation with a USRP B210.
# Targets the OCUDU gNB (n78, 20 MHz, TDD, 30 kHz SCS - see configs/gnb_rf_b200_tdd_n78_20mhz.yml).
# Run from cmake_targets/ran_build/build:
#   sudo ./nr-uesoftmodem -O oaiue_b210.conf

uicc0 = {
  imsi = "001010123456789";
  key = "00112233445566778899aabbccddeeff";
  opc = "00000000000000000000000000000000";
  pdu_sessions = ({ dnn = "internet";
                    nssai_sst = 1;
                  });
}

device = {
  name = "oai_usrpdevif";
}

# USRP B210 over USB3
usrp-args = "type=b200";

# Cell parameters, must match the gNB (20 MHz, n78, 30 kHz SCS)
r               = 51;
numerology      = 1;
band            = 78;
C               = 3408960000L;   # iPhone17 config carrier (3408.96 MHz): same-cell test with the phone

# RF gains (B210: TX 0-89.8 dB, RX 0-76 dB).
# NOTE: OAI subtracts a frequency-dependent calibration offset from rx_gain (~45 dB at 3.5 GHz),
# so ue-rxgain must be ~110 (OAI default) to reach the full UHD RX gain (~65 dB effective).
ue-txgain = 0;   # 0 = max TX gain (OAI maps uhd_gain = 89.75 - tx_gain)
ue-rxgain = 110;

# Pre-compensate the UE B210 free-running clock offset (~2.8 ppm, measured with srsUE
# at 1842.5 MHz as +5199 Hz -> ~9840 Hz at 3489.42 MHz). gNB is GPS-disciplined.
initial-fo = 10000;

# Scan carriers to find the SSB offset automatically; 3/4 FFT sample rate to match gNB srate 23.04 Msps
ue-scan-carrier = 1;
E               = 1;

uecap_file      = "/home/jwang/work/openairinterface5g/targets/PROJECTS/GENERIC-NR-5GC/CONF/uecap_ports1.xml";

# Reduce logging to avoid a log storm that starves the real-time PHY threads
# (journald/rsyslogd were pegging the CPU during the sync loop).
log_config = {
  global_log_level = "info";
  phy_log_level = "info";
};
