# This configuration file example shows how to configure the OCUDU gNB to allow srsUE to connect to it.
# This specific example uses ZMQ in place of a USRP for the RF-frontend, and creates an FDD cell with 10 MHz bandwidth.
# To run the OCUDU gNB with this config, use the following command:
#   sudo ./gnb -c gnb_zmq.yaml

cu_cp:
  amf:
    addr: 192.168.100.127                 # The address or hostname of the AMF.
    port: 38412
    bind_addr: 192.168.100.125            # A local IP that the gNB binds to for traffic from the AMF.
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1
  inactivity_timer: 7200            # Sets the UE/PDU Session/DRB inactivity timer to 7200 seconds. Supported: [1 - 7200].

ru_sdr:
  device_driver: zmq                # The RF driver name.
  device_args: tx_port=tcp://*:2000,rx_port=tcp://198.19.0.2:2001,base_srate=11.52e6 # Optionally pass arguments to the selected RF driver.
  srate: 11.52                      # RF sample rate might need to be adjusted according to selected bandwidth.
  tx_gain: 0                        # Transmit gain of the RF might need to adjusted to the given situation.
  rx_gain: 0                        # Receive gain of the RF might need to adjusted to the given situation.

# NOTE: do not enable execution_profile dual/triple with ZMQ yet: the DL production would outpace the receive
# stream (throttle timeout expires at the slow pull rate) and grow a transmit backlog of up to 53 slots, which
# misses the 1-slot RAR window and breaks the UE attach. Keep the default (sequential/blocking) profile until the
# transmit lead is bounded properly.
#expert_execution:
#  threads:
#    lower_phy:
#      execution_profile: dual

cell_cfg:
  dl_arfcn: 368500                  # ARFCN of the downlink carrier (center frequency).
  band: 3                           # The NR band.
  channel_bandwidth_MHz: 10         # Bandwith in MHz. Number of PRBs will be automatically derived.
  common_scs: 15                    # Subcarrier spacing in kHz used for data.
  plmn: "00101"                     # PLMN broadcasted by the gNB.
  tac: 7                            # Tracking area code (needs to match the core configuration).
  pdcch:
    common:
      ss0_index: 0                  # Set search space zero index to match srsUE capabilities
      coreset0_index: 6             # Set search CORESET Zero index to match srsUE capabilities
    dedicated:
      ss2_type: common              # Search Space type, has to be set to common
      dci_format_0_1_and_1_1: false # Set correct DCI format (fallback)
  prach:
    prach_config_index: 1           # Sets PRACH config to match what is expected by srsUE
    total_nof_ra_preambles: 64      # Sets number of available PRACH preambles
    nof_ssb_per_ro: 1               # Sets the number of SSBs per RACH occasion.
    nof_cb_preambles_per_ssb: 64    # Sets the number of contention based preambles per SSB.
  pdsch:
    mcs_table: qam64                # Sets PDSCH MCS to 64 QAM
  pusch:
    mcs_table: qam64                # Sets PUSCH MCS to 64 QAM

log:
  filename: /tmp/gnb.log            # Path of the log file.
  all_level: debug                   # Logging level applied to all layers.
  lib_level: debug                   # Enables the [zmq-probe] dl/ul lower-PHY logs (temporary, for the E2E comparison).
  hex_max_size: 0

pcap:
  mac_enable: false                  # Set to true to enable MAC-layer PCAPs.
  mac_filename: /tmp/gnb_mac.pcap   # Path where the MAC PCAP is stored.
  ngap_enable: false                 # Set to true to enable NGAP PCAPs.
  ngap_filename: /tmp/gnb_ngap.pcap # Path where the NGAP PCAP is stored.

expert_phy:
  pusch_ldpc_decoder_type:  auto
  pusch_dec_max_iterations: 6
  pusch_channel_estimator_algo: cpu
